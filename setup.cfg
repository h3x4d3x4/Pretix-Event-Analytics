[metadata]
name = pretix-event-analytics
version = 1.1.0
description = Advanced event-level analytics for Pretix with repeat buyer tracking, cohort retention, and predictive scoring
author = Andrei
author_email =
license = Apache Software License
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Plugins
    Framework :: Django
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
install_requires =
    pretix
    pycountry
packages = find:
include_package_data = True
python_requires = >=3.10
zip_safe = False

[options.packages.find]
exclude =
    tests
    tests.*

[options.entry_points]
pretix.plugin =
    pretix_event_analytics = pretix_event_analytics:PretixPluginMeta
