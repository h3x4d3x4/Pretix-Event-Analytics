[metadata]
name = pretix-event-analytics
version = 1.1.1
description = Advanced event-level analytics for Pretix with repeat buyer tracking, cohort retention, and predictive scoring
author = Andre Vidal
author_email = andrei@hexadexa.dev
license = Apache Software License
url = https://github.com/h3x4d3x4/Pretix-Event-Analytics
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    Source = https://github.com/h3x4d3x4/Pretix-Event-Analytics
    Issues = https://github.com/h3x4d3x4/Pretix-Event-Analytics/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Plugins
    Framework :: Django
    Intended Audience :: Developers
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: Apache Software License
    Topic :: Office/Business :: Financial :: Point-Of-Sale
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
install_requires =
    pretix
    pycountry
packages = find:
include_package_data = True
python_requires = >=3.10
zip_safe = False

[options.packages.find]
exclude =
    tests
    tests.*

[options.entry_points]
pretix.plugin =
    pretix_event_analytics = pretix_event_analytics:PretixPluginMeta
